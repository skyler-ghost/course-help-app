<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — University Course Connect Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../css/output.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="brand">
      <i class="fa-solid fa-graduation-cap brand-mark" aria-hidden="true"></i>
      <span class="brand-text">University Course<br>Connect Portal</span>
    </a>
    <div class="header-actions">
      <span id="auth-slot"><a href="login.html" class="login-btn"><i class="fa-regular fa-user"></i>Login</a></span>
    </div>
  </div>
  </nav>
</header>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-icon"><i class="fa-solid fa-user-plus"></i></div>
    <h1>Create an account</h1>
    <p class="auth-sub">Register to search courses and message lecturers.</p>

    <div id="form-error" class="form-error"></div>

    <form id="register-form">
      <div class="form-field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" required autocomplete="name">
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="auth-submit">Create account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
  </div>
</main>

<script src="../js/main.js"></script>
<script src="../js/common.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
